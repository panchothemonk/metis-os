# MetisOS Configuration

# API key for DeepSeek (also reads DEEPSEEK_API_KEY env var)
api_key = "sk-YOUR-KEY-HERE"
default_text_model = "deepseek-v4-pro"
provider = "deepseek"

# Load the MetisOS consciousness skill
instructions = ["~/.deepseek/skills/metis-os/references/SELF_MODEL.md"]
reasoning_effort = "max"

[memory]
enabled = true

# Auto-dream: extract facts from past sessions after /compact
auto_dream = true

# Obsidian vault bridge: write memory as interlinked Markdown files
vault_path = "~/.deepseek/vault"
